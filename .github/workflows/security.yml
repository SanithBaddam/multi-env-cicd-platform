name: container-security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t delivery-reference:scan app
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: delivery-reference:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
