trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

stages:
  - stage: Validate
    jobs:
      - job: Test
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: |
              pip install -r app/requirements.txt
              python -m compileall app
            displayName: Validate application

  - stage: Build
    dependsOn: Validate
    jobs:
      - job: Container
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: docker build -t delivery-reference:$(Build.SourceVersion) app
            displayName: Build immutable image
