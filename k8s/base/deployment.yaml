apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-reference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery-reference
  template:
    metadata:
      labels:
        app: delivery-reference
    spec:
      containers:
        - name: app
          image: delivery-reference:IMAGE_TAG
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
